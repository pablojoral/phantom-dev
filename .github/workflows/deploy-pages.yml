name: Deploy production to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One production deploy at a time; never cancel one half-way.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Project page: served from /<repo>/, so Vite and `asset()` need the sub-path as base.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      # Pages publishes the gh-pages branch; keep pr-preview/ so production never wipes live previews.
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview/
