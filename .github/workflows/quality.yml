name: Quality

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `npm run build` runs `tsc -b` first, so this is also the type check. Base stays `/`.
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # linkedin.com answers bots with 999. The bare font hosts are preconnect targets (their roots
      # 404), and the Pages site is this repo's own output, which a PR can't have deployed yet.
      - uses: lycheeverse/lychee-action@v2
        with:
          # Mail links are skipped by default in lychee >= 0.2x (`--include-mail` opts in), and
          # `--root-dir` (absolute path) replaces the deprecated `--base` for root-absolute links.
          args: >-
            --no-progress
            --exclude linkedin\.com
            --exclude localhost
            --exclude '^https://fonts\.(googleapis|gstatic)\.com/?$'
            --exclude 'pablojoral\.github\.io'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
            README.md
          fail: true
